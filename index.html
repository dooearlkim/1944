<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SKY ACE">
<meta name="format-detection" content="telephone=no">
<title>SKY ACE 1944</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000;
    touch-action: none; -ms-touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  body { position: fixed; inset: 0; }
  #wrap {
    position: absolute;
    left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px);
    top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px);
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    display: block; background: #000;
    image-rendering: optimizeSpeed; image-rendering: crisp-edges; image-rendering: pixelated;
    -ms-interpolation-mode: nearest-neighbor;
  }
  .btn {
    position: absolute; display: none; padding: 0; margin: 0; outline: none;
    touch-action: none; -webkit-user-select: none; user-select: none;
    font: bold 13px/1 monospace; color: rgba(255,255,255,.85);
    border: 2px solid rgba(255,255,255,.45);
  }
  body.playing .btn { display: block; }
  #bombBtn {
    width: 78px; height: 78px; border-radius: 50%;
    right: calc(env(safe-area-inset-right, 0px) + 14px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
    background: rgba(230, 70, 40, .30); font-size: 15px; letter-spacing: 1px;
  }
  #bombBtn.on { background: rgba(255, 160, 40, .65); }
  #pauseBtn {
    width: 38px; height: 34px; border-radius: 8px;
    right: calc(env(safe-area-inset-right, 0px) + 8px);
    top: calc(env(safe-area-inset-top, 0px) + 8px);
    background: rgba(255,255,255,.10); border-color: rgba(255,255,255,.3);
  }
</style>
</head>
<body>
  <div id="wrap"><canvas id="game" width="240" height="320"></canvas></div>
  <button id="bombBtn" class="btn" aria-label="Bomb">BOMB</button>
  <button id="pauseBtn" class="btn" aria-label="Pause">II</button>
  <script src="game.js"></script>
</body>
</html>
